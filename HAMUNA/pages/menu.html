<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<link rel="stylesheet" href="../css/menu.css">
<title>Kelola Menu</title>
</head>

</head>

<body>

<div class="header-menu">
    <h2>🍽️ Kelola Menu</h2>
    <button id="btnTambah">+ Tambah Menu</button>
</div>

<!-- FORM TAMBAH -->
<div class="form-box" id="formBox">
    <input type="text" id="namaMenu" placeholder="Nama Menu">
    <input type="number" id="hargaMenu" placeholder="Harga">
    <input type="file" id="gambarMenu">

    <select id="kategoriMenu">
        <option>Makanan</option>
        <option>Minuman</option>
        <option>Dessert</option>
        <option>Lain-lain</option>
        <option>Tambahan</option>
    </select>

    <button id="btnSimpan">Simpan</button>
</div>

<!-- FILTER ATAS -->
<div class="top-filter">
    <button class="filter-btn active" data-kategori="Semua">Semua</button>
    <button class="filter-btn" data-kategori="Makanan">Makanan</button>
    <button class="filter-btn" data-kategori="Minuman">Minuman</button>
    <button class="filter-btn" data-kategori="Dessert">Dessert</button>
    <button class="filter-btn" data-kategori="Lain-lain">Lain-lain</button>
    <button class="filter-btn" data-kategori="Tambahan">Tambahan</button>
</div>


<!-- MENU -->
<div class="menu-list" id="menuList"></div>

<!-- MODAL EDIT -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <h3>Edit Menu</h3>
        <img id="previewEdit" class="preview-edit">
        <input type="text" id="editNama">
        <input type="number" id="editHarga">
        <input type="file" id="editGambar">
    
        <select id="editKategori">
            <option>Makanan</option>
            <option>Minuman</option>
            <option>Dessert</option>
            <option>Lain-lain</option>
            <option>Tambahan</option>
        </select>

        <div class="modal-action">
            <button id="btnUpdate">Update</button>
            <button onclick="closeModal()">Batal</button>
        </div>
    </div>
</div>

<script src="../js/firebase.js"></script>
<script src="../js/menu.js"></script>
<script src="../js/guard.js"></script>

</body>
</html>
