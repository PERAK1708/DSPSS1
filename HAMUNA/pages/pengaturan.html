<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengaturan</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<link rel="stylesheet" href="../css/pengaturan.css">
</head>

<body>

<div class="settings-container">

    <h2>Pengaturan Kontak & Sosial Media</h2>

    <div class="settings-grid">

        <div class="setting-item">
            <label>WhatsApp</label>
            
            <div class="setting-row">
                <input type="text" id="whatsapp">
                <button onclick="updateField('whatsapp')">Update</button>
            </div>
        </div>

        <div class="setting-item">
            <label>Telepon</label>
             <div class="setting-row">
                <input type="text" id="telepon">
                <button onclick="updateField('telepon')">Update</button>
             </div>
        </div>

        <div class="setting-item">
            <label>Instagram</label>
            <div class="setting-row">
                <input type="text" id="instagram">
                <button onclick="updateField('instagram')">Update</button>
            </div>
        </div>

        <div class="setting-item">
            <label>Facebook</label>
            <div class="setting-row">
                <input type="text" id="facebook">
                <button onclick="updateField('facebook')">Update</button>
            </div>
        </div>

        <div class="setting-item">
            <label>TikTok</label>
            <div class="setting-row">
                <input type="text" id="tiktok">
                <button onclick="updateField('tiktok')">Update</button>
            </div>
        </div>

        <div class="setting-item">
            <label>Email</label>
            <div class="setting-row">
                <input type="email" id="email">
                <button onclick="updateField('email')">Update</button>
            </div>
                </div>
<div class="setting-item">
    <label>Telegram</label>
    <div class="setting-row">
        <input type="text" id="telegram">
        <button onclick="updateField('telegram')">
            Update
        </button>
    </div>
</div>
        <div class="setting-item">
            <label>alamat</label>
            <div class="setting-row">
                <input type="email" id="alamat">
                <button onclick="updateField('alamat')">Update</button>
            </div>
        
     
        </div>

    </div>

</div>

<script src="../js/firebasesetting.js"></script>
<script src="../js/settings.js"></script>

</body>
</html>
