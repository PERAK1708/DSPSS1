<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DAFTAR MENU</title>

<link rel="stylesheet" href="../css/stylepelanggan.css">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>

<body>

<header class="header">

    <div class="logo">
        🍽️ <span>HAMUNA RESTO</span>
    </div>

    <div class="subtitle">
        Kalau lapar, ingat... ada Hamuna Resto
    </div>

    <div class="contact-bar">
        <a id="waLink" target="_blank">📱 WhatsApp</a>
        <a id="telLink">☎️ Telepon</a>
        <a id="telegramLink" target="_blank">✈️ Telegram</a>
    </div>
    
    <div class="search-box">
        <input type="text" id="searchMenu" placeholder="Cari menu...">
    </div>

    <div class="category">
        <button class="active" data-kategori="Semua">Semua</button>
        <button data-kategori="Makanan">Makanan</button>
        <button data-kategori="Minuman">Minuman</button>
        <button data-kategori="Dessert">Dessert</button>
        <button data-kategori="Tambahan">Tambahan & Khusus</button>
        <button data-kategori="Lain-lain">Lain-lain</button>
 
        
    </div>

</header>

<div class="container">

    <div id="menuList" class="menu-grid"></div>

    <div class="checkout" id="checkoutBox">

        <h3>🛒 Keranjang</h3>

        <div class="order-type">
            <label><input type="radio" name="orderType" value="dinein" checked> Dine In</label>
            <label><input type="radio" name="orderType" value="delivery"> Delivery</label>
        </div>

        <div id="tableBox">
            <input type="text" id="tableNumber" placeholder="Nomor Meja">
        </div>

        <div id="addressBox" style="display:none;">
            <textarea id="customerAddress" placeholder="Alamat / Lokasi"></textarea>
        </div>

        <input type="text" id="customerName" placeholder="Nama Pemesan">

        <div id="cartItems"></div>
        <div id="cartSummary"></div>

        <button onclick="checkout()">Kirim Pesanan</button>

    </div>

</div>

<!-- MODAL -->
<div id="orderModal" class="modal hidden">
    <div class="modal-box">
        <h2>KONFIRMASI PEMBAYARAN PESANAN </h2>

        <p class="warning">⚠️ Simpan dan salin ID pesanan</p>

        <div class="order-id">
            <span>ID:</span>
            <b id="modalOrderId"></b>
            <button onclick="copyOrderId()">📋</button>
        </div>

            <div class="order-info">
                <div class="info-row">
                    <span>Nama</span>
                    <b id="modalNama"></b>
                </div>

                <div class="info-row" id="modalInfoRow">
                    <span id="modalInfoLabel"></span>
                    <b id="modalInfoValue"></b>
                </div>
            </div>

            <div id="modalItems" class="modal-items"></div>

            <div class="modal-total">
                <span>Total Bayar</span>
                <h2>Rp <span id="modalTotal"></span></h2>
            </div>

        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">BATAL / EDIT PESANAN</button>
            <button class="btn-save" onclick="saveOrder()">KONFIRMASI & BAYAR PESANAN</button>
        </div>

    </div>
</div>

<script src="../js/firebase.js"></script>
<script src="../js/settings-public.js"></script>
<script src="../js/app.js"></script>

<button class="mobile-cart-btn" onclick="toggleCart()">
    🛒 Keranjang
</button>
</body>
</html>
