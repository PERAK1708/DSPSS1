<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment & Status</title>

<link rel="stylesheet" href="../publik/css/payment.css">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

</head>

<body>

<div class="container">

    <!-- PAYMENT -->
    <div class="box pay-box">
        <h2>💳 Pembayaran</h2>

        <img id="qrisImg" class="qr" src="" alt="QRIS">
        <div id="uploadProofBox" class="upload-proof">

            <h3>Upload Bukti Pembayaran</h3>

            <input
                type="file"
                id="proofFile"
                accept="image/*">

            <button onclick="uploadBukti()">
                📤 Kirim Bukti Pembayaran
            </button>

        </div>
        <div class="bank-box" id="bankList"></div>

        <p>ID Pesanan:</p>
        <b id="orderId">-</b>

        <p>Total:</p>
        <h3 id="total">Rp 0</h3>

        <button onclick="copyId()">Copy ID</button>
    </div>

    <!-- STATUS -->
    <div class="box">
        <h2>📦 Cek Status</h2>

        <input id="inputId" placeholder="Masukkan ID">

        <button onclick="cekStatus()">Cek Status</button>

        <div id="statusBox" class="status"></div>

        <!-- HASIL DETAIL ORDER -->
        <div id="orderInfo"></div>
        <div id="actionArea"></div>
    </div>

</div>


<script src="/publik/js/firebase.js"></script>
<script src="../publik/js/payment.js"></script>

</body>
</html>
