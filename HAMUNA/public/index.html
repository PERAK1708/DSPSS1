<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">



<title>DAFTAR MENU </title>

<link rel="stylesheet" href="../css/stylepelanggan.css">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>

<!-- HEADER -->

<header class="header">

    <div class="logo">
        🍽️ SxxxxxxL
    </div>

    <div class="subtitle">
        Pesan langsung dari Rumah & meja Anda 
    </div>

</header>

<!-- SEARCH -->

<div class="search-box">

    <input
        type="text"
        id="searchMenu"
        placeholder="Cari menu...">

</div>

<!-- KATEGORI -->

<div class="category">

    <button class="active" data-kategori="Semua">Semua</button>
    <button data-kategori="Makanan">Makanan</button>
    <button data-kategori="Minuman">Minuman</button>
    <button data-kategori="Dessert">Dessert</button>
    <button data-kategori="Lain-lain">Lain-lain</button>
    <button data-kategori="Tambahan">Tambahan</button>

</div>

<div class="container">

    <div id="menuList" class="menu-grid"></div>

    <div class="checkout">

        <h3>🛒 Keranjang</h3>

        <input type="text" id="customerName" placeholder="Nama Pemesan">
        <input type="text" id="tableNumber" placeholder="Nomor Meja">

        <div id="cartItems"></div>
        <div id="cartSummary"></div>

        <button onclick="checkout()">Kirim Pesanan</button>

    </div>

</div>


<div id="orderModal" class="modal hidden">
    <div class="modal-box">

        <h2>🎉 Pesanan Berhasil</h2>

        <p class="warning">
            ⚠️ Simpan ID pesanan untuk cek status & konfirmasi
        </p>

        <div class="order-id">
            <span>ID:</span>
            <b id="modalOrderId"></b>
            <button onclick="copyOrderId()">📋</button>
        </div>

        <div class="order-info">
            <p><b>Nama:</b> <span id="modalNama"></span></p>
            <p><b>Meja:</b> <span id="modalMeja"></span></p>
        </div>

        <div id="modalItems"></div>

        <h3>Total: Rp <span id="modalTotal"></span></h3>

        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">Batal</button>
            <button class="btn-save" onclick="saveOrder()">Simpan & Bayar</button>
        </div>

    </div>
</div>
<!-- JS -->

<script src="../js/firebase.js"></script>
<script src="../js/app.js"></script>

</body>

</html>
